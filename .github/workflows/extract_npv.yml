name: Convert All to CSV

on:
  push:
    branches: [ auto-analysis ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-models:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install pandas openpyxl
        
    - name: Run Conversion Script
      run: |
        cat <<EOF > convert.py
        import glob, os
        import pandas as pd
        import warnings
        
        # Suppress openpyxl warnings about extensions/formatting
        warnings.simplefilter("ignore")

        print("Starting bulk conversion...")
        
        output_dir = "csv_exports"
        os.makedirs(output_dir, exist_ok=True)
        
        files = glob.glob("*.xlsx")
        print(f"Found {len(files)} Excel files")

        for path in files:
            ticker = os.path.splitext(os.path.basename(path))[0]
            # Sanitize filename for safety
            safe_ticker = "".join([c for c in ticker if c.isalnum() or c in (' ', '-', '_')]).strip()
            print(f"Processing {safe_ticker}...")
            
            try:
                # Read all sheets
                xls = pd.ExcelFile(path)
                for sheet_name in xls.sheet_names:
                    try:
                        df = pd.read_excel(xls, sheet_name=sheet_name)
                        
                        # Sanitize sheet name
                        safe_sheet = "".join([c for c in sheet_name if c.isalnum() or c in (' ', '-', '_')]).strip()
                        if not safe_sheet:
                            safe_sheet = "Sheet"
                            
                        out_name = f"{safe_ticker}_{safe_sheet}.csv"
                        out_path = os.path.join(output_dir, out_name)
                        
                        df.to_csv(out_path, index=False)
                    except Exception as e:
                        print(f"  Error on sheet {sheet_name}: {e}")
                        
            except Exception as e:
                print(f"Failed to read {path}: {e}")
        EOF
        
        python convert.py
        
    - name: Commit CSVs
      run: |
        git config --global user.name 'CSV Bot'
        git config --global user.email 'bot@noreply.github.com'
        git add csv_exports/
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          print("No changes to commit")
        else
          git commit -m "Bulk convert all models to CSV"
          git push
        fi
